name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find the project folder
        run: |
          PKG=$(find . -name package.json -not -path '*/node_modules/*' | head -1)
          echo "APP=$(dirname "$PKG")" >> $GITHUB_ENV
          echo "Project found in: $(dirname "$PKG")"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install and build
        working-directory: ${{ env.APP }}
        run: |
          npm install
          npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.APP }}/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
